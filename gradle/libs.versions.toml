[versions]
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activityKtx = "1.9.3"
constraintlayout = "2.2.0"
hilt = "2.52"
navigation = "2.8.3"
retrofit = "2.11.0"
coroutines = "1.9.0"
lifecycle = "2.8.7"
core-testing = "2.2.0"
mockito = "5.14.2"
